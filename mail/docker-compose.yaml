services:
  stalwart-mail:
    image: stalwartlabs/stalwart:latest
    container_name: stalwart-mail
    restart: unless-stopped
    volumes:
      - ./data:/opt/stalwart/data
      - ./etc:/opt/stalwart/etc
      - ./logs:/opt/stalwart/logs
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true