services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cloudflare.conf:/etc/nginx/conf.d/cloudflare.conf:ro
      - ./reviews/:/var/www/reviews:ro
      - ./ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - ./security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      - ./letsencrypt.conf:/etc/nginx/snippets/letsencrypt.conf:ro
      - ./whitelist.conf:/etc/nginx/conf.d/whitelist.conf:ro
    networks:
      proxy-network:
        ipv4_address: 172.25.0.10
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  proxy-network:
    name: proxy-network
    external: true