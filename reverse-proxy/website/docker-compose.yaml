services:
  danbesy-website:
    image: ${DOCKER_IMAGE}:${IMAGE_TAG}
    container_name: danbesy-website
    restart: unless-stopped
    networks:
      - reverse-proxy-network
    environment:
      - NODE_ENV=production
      - PORT=8888
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  reverse-proxy-network:
    external: true