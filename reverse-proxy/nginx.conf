# Reviews - reviews.danbesy.com
server {
    listen 80;
    server_name reviews.danbesy.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name reviews.danbesy.com;

    ssl_certificate /etc/nginx/certs/cloudflare/danbesy.com/cert.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare/danbesy.com/key.pem;

    include /etc/nginx/conf.d/ssl.conf;
    include /etc/nginx/conf.d/security-headers.conf;

    root /var/www/reviews/;
    index index.html;

    location / {
            try_files $uri $uri/ =404;
        }
        
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|mp4|webm|webp|svg)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";

            try_files $uri =404;
    }
}
  
# Cockpit - panel.danbesy.com
server {
    listen 80;
    server_name panel.danbesy.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name panel.danbesy.com;

    ssl_certificate /etc/nginx/certs/cloudflare/danbesy.com/cert.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare/danbesy.com/key.pem;

    include /etc/nginx/conf.d/ssl.conf;
    include /etc/nginx/conf.d/security-headers.conf;

    location / {
        proxy_pass http://host.docker.internal:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_ssl_verify off;
	    proxy_http_version 1.1;
    }
}

# Grafana - grafana.danbesy.com
