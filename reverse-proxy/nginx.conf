# Получение LetsCrypt сертификата
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/snippets/letsencrypt.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Редирект с danbesy.com и tg.danbesy.com в Telegram
server {
    listen 80;
    server_name danbesy.com tg.danbesy.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name danbesy.com tg.danbesy.com;

    ssl_certificate /etc/nginx/certs/cloudflare/danbesy.com/cert.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare/danbesy.com/key.pem;

    include /etc/nginx/conf.d/ssl.conf;
    include /etc/nginx/conf.d/security-headers.conf;

    return 301 https://t.me/danbesy;
}

