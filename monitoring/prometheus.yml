global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'grafana'
    static_configs:
      - targets: ['127.0.0.1:13000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:19090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['127.0.0.1:19100']
        labels:
          instance: 'main-server'
          hostname: 'danbesy.server'
          env: 'prod'