- name: Generate MTProto-Proxy config from template
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ project_base_dir }}/mtproto-proxy/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  become: true
  notify: restart mtproto-proxy stack

- name: Start MTProto-Proxy stack with Docker Compose V2
  community.docker.docker_compose_v2:
    project_src: "{{ project_base_dir }}/mtproto-proxy"
    state: present
    pull: always
    wait: false
  become: true