- name: Generate Matrix docker-compose from template
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ project_base_dir }}/matrix/docker-compose.yaml"
    mode: '0644'
  become: true
  notify: restart matrix stack

- name: Generate Dendrite config from template
  ansible.builtin.template:
    src: dendrite.yaml.j2
    dest: "{{ project_base_dir }}/matrix/dendrite.yaml"
    mode: '0644'
  become: true
  notify: restart matrix stack

- name: Start Matrix stack with Docker Compose V2
  community.docker.docker_compose_v2:
    project_src: "{{ project_base_dir }}/matrix"
    state: present
    pull: always
    wait: false
  become: true