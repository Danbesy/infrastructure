- name: Generate Mail docker-compose from template
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ project_base_dir }}/mail/docker-compose.yaml"
    mode: '0644'
  become: true
  notify: restart mail stack

- name: Start Mail stack with Docker Compose V2
  community.docker.docker_compose_v2:
    project_src: "{{ project_base_dir }}/mail"
    state: present
    pull: always
    wait: false
  become: true