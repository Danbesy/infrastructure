services:
  caddy:
    image: caddy:2.11.3-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data:/srv
      - caddy_data:/data
      - caddy_config:/config
    networks:
      reverse-proxy-network:
        ipv4_address: 172.20.0.30

networks:
  reverse-proxy-network:
    name: reverse-proxy-network
    external: true

volumes:
  caddy_data:
  caddy_config: